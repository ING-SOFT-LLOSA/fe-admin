# SonarQube Configuration for llosa-backoffice
sonar.projectKey=llosa-backoffice
sonar.projectName=Llosa Backoffice
sonar.projectVersion=0.1.0

# Source code directories
sonar.sources=src,app,pages,components,lib,utils
sonar.tests=src

# Programming language
sonar.language=js

# File exclusions
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/.git/**,**/coverage/**,**/*.config.js,**/vite.config.ts,**/next.config.ts,**/tailwind.config.ts

# TypeScript/JavaScript specific settings
sonar.javascript.file.suffixes=.js,.jsx,.ts,.tsx
sonar.typescript.file.suffixes=.ts,.tsx

# Coverage reports (optional - enable if using coverage tools)
# sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Quality gate - fail if critical issues found
sonar.qualitygate.wait=true