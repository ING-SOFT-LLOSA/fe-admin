# SonarQube Configuration for llosa-backoffice
sonar.projectKey=llosa-backoffice
sonar.projectName=Llosa Backoffice
sonar.projectVersion=0.1.0

# Source code
sonar.sources=src
sonar.tests=src

# Exclusions
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/.git/**,**/coverage/**,**/*.config.*

# Coverage (optional)
# sonar.javascript.lcov.reportPaths=coverage/lcov.info

# TypeScript config (IMPORTANT)
sonar.typescript.tsconfigPath=tsconfig.json

# Encoding
sonar.sourceEncoding=UTF-8

# Quality gate
sonar.qualitygate.wait=true