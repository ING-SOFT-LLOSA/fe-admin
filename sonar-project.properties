sonar.projectKey=llosa-backoffice
sonar.projectName=Llosa Backoffice
sonar.projectVersion=0.1.0

# Ubicación de código fuente y pruebas
sonar.sources=src
sonar.tests=src
sonar.sourceEncoding=UTF-8

# Lenguaje
sonar.language=ts

# Exclusiones
sonar.exclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/__tests__/**,**/dist/**,**/node_modules/**,**/*.d.ts,**/vite*.config.ts,**/vitest*.config.ts,.next/**
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx

# Cobertura de Código
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Análisis de TypeScript
sonar.typescript.tsconfigPath=tsconfig.json

# Exclusiones adicionales para análisis
sonar.coverage.exclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/__tests__/**,**/node_modules/**,**/*.d.ts